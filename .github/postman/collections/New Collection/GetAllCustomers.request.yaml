  - type: afterResponse
    code: "const jsonData = pm.response.json();\r

      \r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response has JSON content-type\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      pm.test(\"Response is an array\", function () {\r

      \    pm.expect(jsonData).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Each customer has required fields\", function () {\r

      \    jsonData.forEach(function (customer) {\r

      \        pm.expect(customer).to.have.property(\"id\");\r

      \        pm.expect(customer).to.have.property(\"firstName\");\r

      \        pm.expect(customer).to.have.property(\"lastName\");\r

      \        pm.expect(customer).to.have.property(\"phone\");\r

      \        \r

      \    });\r

      });\r

      \r

      pm.test(\"Response time is less than 200ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(200);\r

      });"
